name: github pages

on:
  push:
    tags:
      - "**[0-9]+.[0-9]+.[0-9]+*"
    branches:
      - main
    paths:
      - "guide/**"
      - ".github/workflows/gh-pages.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.40"
          # mdbook-version: 'latest'

      - name: Pull latest version
        run: |
          TARGET_FILE="guide/src/guide/installation.md"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # The GitHub release for this tag is created later by release.yml, so read the version from the tag
            VERSION=$(echo "$GITHUB_REF_NAME" | grep -oP 'v?\K[0-9]+\.[0-9]+\.[0-9]+')
          else
            MITO_RELEASE=$(curl --silent -m 10 --connect-timeout 5 "https://api.github.com/repos/stack-rs/mitosis/releases/latest")
            VERSION=$(echo "$MITO_RELEASE" | grep -oP '"tag_name":\s*"[^"]*-v?\K[0-9]+\.[0-9]+\.[0-9]+')
          fi
          echo "Latest version: $VERSION"
          TEMP_FILE=$(mktemp)
          awk -v new_version="mito-v$VERSION" '{ gsub(/mito-v[0-9]+\.[0-9]+\.[0-9]+/, new_version); print }' "$TARGET_FILE" >"$TEMP_FILE"
          if [ $? -ne 0 ]; then
            rm -f "$TEMP_FILE"
            exit 0
          fi
          mv "$TEMP_FILE" "$TARGET_FILE"
      - run: mdbook build
        working-directory: ./guide

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/mito-v') }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./guide/book
