# The default configurations for the mitosis coordinator
[coordinator]
bind = "127.0.0.1:5000"
db_url = "postgres://db_user:db_pass@localhost/db_name"
s3_url = "http://127.0.0.1:9000"
s3_access_key = "mitosis_access"
s3_secret_key = "mitosis_secret"
# s3_region is not set. Defeault to "mitosis"
# s3_force_path_style is not set. Default to false
# Bucket names for storing artifacts and attachments
# artifacts_bucket is not set by default. Default to "mitosis-artifacts"
# attachments_bucket is not set by default. Default to "mitosis-attachments"
# redis_url is not set. It should be in format like "redis://:mitosis@localhost"
# redis_worker_password is not set by default and will be generated randomly
# redis_client_password is not set by default and will be generated randomly
# redis_skip_acl_rules is not set. Default to false, meaning ACL rules will be applied if redis_version >= 6.0
# admin_user specifies the username of the admin user created on startup
admin_user = "mitosis_admin"
# admin_password specifies the password of the admin user created on startup
admin_password = "mitosis_admin"
access_token_private_path = "private.pem"
access_token_public_path = "public.pem"
# access_token_expires_in applies to user access tokens only. Worker token lifetimes are
# chosen by the Worker itself, via its own lifetime setting.
access_token_expires_in = "7d"
heartbeat_timeout = "600s"
# ws_keepalive_interval is the keepalive cadence on agent notification sockets
ws_keepalive_interval = "30s"
file_log = false
# log_path is not set. It will use the default rolling log file path if file_log is set to true

[worker]
coordinator_addr = "http://127.0.0.1:5000"
polling_interval = "3m"
heartbeat_interval = "5m"
# lifetime controls the worker JWT token lifetime.
# Use a duration such as "7d", "1h", or "30m". If omitted, the token never expires.
# The Coordinator's access_token_expires_in does not apply to worker tokens. The lifetime of
# worker token is completely controlled by worker side's settings.
# lifetime is not set
# credential_path is not set
# user is not set
# password is not set
# groups are not set, default to the user's group
# tags are not set
file_log = false
# shared_log is not set, default to false. When enabled, all workers share a centralized log file with daily rotation (max 3 files)
# log_path is not set. It will use the default rolling log file path if file_log is set to true
#   - If shared_log is enabled and log_path is not set, it will use workers.log in cache directory
#   - If shared_log is disabled and log_path is not set, it will use {worker_uuid}.log in cache directory

[agent]
coordinator_addr = "http://127.0.0.1:5000"
heartbeat_interval = "1m"
# connect_retry_interval is the gap between retries of a coordinator call that
#   could not connect. 
connect_retry_interval = "30s"
lifetime = "30d"
# idle_poll_interval is not set. When set, an agent holding no suite asks the
#   coordinator for one that often, instead of waiting to be told about one.
#   Pickup is signal-driven without it: a notification, or the nudge that every
#   heartbeat answer carries — so with no_ws and a slow heartbeat, waiting for
#   work costs up to a whole heartbeat_interval. Each poll costs the coordinator
#   a lookup, so keep it off unless the latency matters.
# ws_reconnect_interval is how long to wait before reopening a notification
#   WebSocket that dropped. Ignored when no_ws is set.
ws_reconnect_interval = "5s"
# no_ws is not set, default to false. When enabled the agent never opens the
#   notification WebSocket and takes its notifications from heartbeat answers
#   alone. Nothing is lost — the coordinator buffers each notification until it
#   is acknowledged — only delivery latency changes. For hosts where the socket
#   cannot be opened or held, a proxy in the way being the usual reason.
# credential_path is not set
# user is not set
# password is not set
# admin_group is not set, default to the registering user's own group. It is the
#   one group that can shut the agent down, and the user must be its Admin.
# groups are not set, default to the user's group. Each listed group gains Write
#   access to the agent. Registration rewrites group access outright, so a group
#   left out of a re-registration loses the access it had.
# tags are not set. An agent is eligible for a suite when it carries every tag
#   the suite asks for.
# labels are not set. Labels are for querying only, never for matching.
# machine_code is not set. It is resolved from the cached value, then
#   /etc/machine-id, then a generated UUID. It keys the agent's record, so a
#   machine that comes back with a different code strands its old record.

[client]
# user = "mitosis_admin"
# password = "mitosis_admin"
# refresh is not set, default to false. When true, the client refreshes the current login token and invalidates previous tokens.

