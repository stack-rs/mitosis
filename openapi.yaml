      type: object
      required:
        - cores
        - strategy
      properties:
        cores:
          type: array
          items:
            type: integer
            format: uint
          description: CPU core ids to bind to
          example:
            - 0
            - 1
        strategy:
          $ref: "#/components/schemas/CpuBindingStrategy"

    WorkerSchedulePlan:
      type: object
      description: Worker allocation plan for a suite, tagged by `type`
      required:
        - type
        - worker_count
      properties:
        type:
          type: string
          enum:
            - FixedWorkers
          description: Scheduling policy discriminator
        worker_count:
          type: integer
          format: uint32
          minimum: 1
          maximum: 256
          description: Number of workers to spawn
          example: 8
        cpu_binding:
          $ref: "#/components/schemas/CpuBinding"
        task_prefetch_count:
          type: integer
          format: uint32
          default: 16
          description: How many tasks each worker prefetches locally
          example: 16

    ExecHooks:
      type: object
      description: Suite lifecycle hooks; each entry is an execution spec (ExecSpec) run at a phase
      properties:
        provision:
          type: object
          description: Hook run before workers start
        cleanup:
          type: object
          description: Hook run after the suite completes
        background:
          type: object
          description: Hook run alongside workers

