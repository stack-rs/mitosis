          type: integer
          format: uint64
          description: Total match count (count mode), otherwise the number of suites on this page
        suites:
          type: array
          items:
            $ref: "#/components/schemas/TaskSuiteInfo"
        group_name:
          type: string

    ParsedTaskSuiteInfo:
      type: object
      required:
        - uuid
        - group_name
        - creator_username
        - tags
        - labels
        - priority
        - worker_schedule
        - state
        - total_tasks
        - incomplete_tasks
        - created_at
        - updated_at
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        group_name:
          type: string
        creator_username:
          type: string
        tags:
          type: array
          items:
            type: string
        labels:
          type: array
          items:
            type: string
        priority:
          type: integer
          format: int32
        worker_schedule:
          $ref: "#/components/schemas/WorkerSchedulePlan"
        exec_hooks:
          $ref: "#/components/schemas/ExecHooks"
        state:
          $ref: "#/components/schemas/TaskSuiteState"
        last_task_submitted_at:
          type: string
          format: date-time
          nullable: true
        total_tasks:
          type: integer
          format: int32
        incomplete_tasks:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    TaskSuiteQueryResp:
      type: object
      required:
        - info
        - eligible_agents
        - active_jobs
      properties:
        info:
          $ref: "#/components/schemas/ParsedTaskSuiteInfo"
        eligible_agents:
          type: array
          items:
            type: string
            format: uuid
          description: >-
            UUIDs of every agent that may run this suite:
            `(tag-matched ∪ included) − excluded`, restricted to agents the
            suite's group has write access to
        active_jobs:
          type: array
          items:
            $ref: "#/components/schemas/SuiteJobInfo"
          description: >-
            The suite's non-terminal jobs (`Provisioning`, `Executing`,
            `Cleanup`), oldest first — the agents actually running it right now,
            as opposed to the ones merely eligible. Empty when nothing holds the
            suite.

    SuiteAgentOverrideAction:
      type: string
      enum:
        - include
        - exclude
        - clear
      description: |
        What to do with one agent on a suite:
        - include: pin it even if it does not tag-match
        - exclude: block it even if it tag-matches
        - clear: drop any manual override, back to the tag-match default

    SuiteAgentOverrideReq:
      type: object
      required:
        - overrides
      properties:
        overrides:
          type: object
          description: Agent uuid → action
          additionalProperties:
            $ref: "#/components/schemas/SuiteAgentOverrideAction"

    SuiteAgentOverrideResp:
      type: object
      required:
        - errors
      properties:
        errors:
          type: object
          description: >-
            Entries that could not be applied, keyed by the same agent uuid as
            the request. An empty object means every entry succeeded.
          additionalProperties:
            type: object
            properties:
              msg:
                type: string

    SuiteJobState:
      type: string
      enum:
        - Provisioning
        - Executing
        - Cleanup
        - Completed
        - Failed
        - Lost
        - Killed
      description: |
        One agent's attempt at running a suite:
        - Provisioning → Executing → Cleanup are the active phases
        - Completed: every hook succeeded (whether or not the suite drained)
        - Failed: a hook failed
        - Lost: the agent's heartbeat lapsed mid-job
        - Killed: force-stopped, with no cleanup

    HookType:
      type: string
      enum:
        - Provision
        - Cleanup
        - Background

    HookExecState:
      type: string
      enum:
        - Completed
        - Failed
        - Cancelled
      description: >-
        A hook is recorded only when it finishes, so there is no running state.

    SuiteJobsQueryReq:
      type: object
      properties:
        states:
          type: array
          items:
            $ref: "#/components/schemas/SuiteJobState"
          nullable: true
          description: Filter by job states
        agent_uuid:
          type: string
          format: uuid
          nullable: true
          description: >-
            Only jobs run by this agent. An agent that never ran this suite
            yields an empty listing rather than a 404.
        limit:
          type: integer
          format: uint64
          nullable: true
          description: Maximum number of results
        offset:
          type: integer
          format: uint64
          nullable: true
          description: Offset for pagination
        count:
          type: boolean
          default: false
          description: When true, return only the total match count (jobs is empty)

    SuiteJobInfo:
      type: object
      required:
        - job_id
        - state
        - created_at
        - updated_at
      properties:
        job_id:
          type: integer
          format: int32
          description: Suite-scoped job number, ascending from 1
        state:
          $ref: "#/components/schemas/SuiteJobState"
        agent_uuid:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SuiteJobsQueryResp:
      type: object
      required:
        - count
        - jobs
      properties:
        count:
          type: integer
          format: uint64
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/SuiteJobInfo"

    HookTaskInfo:
      type: object
      required:
        - uuid
        - hook_type
        - state
      properties:
        uuid:
          type: string
          format: uuid
          description: Also the key this hook's artifacts are stored under
        hook_type:
          $ref: "#/components/schemas/HookType"
        state:
          $ref: "#/components/schemas/HookExecState"
        result:
          $ref: "#/components/schemas/TaskResultSpec"
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    SuiteJobQueryResp:
      type: object
      required:
        - info
        - hooks
      properties:
        info:
          $ref: "#/components/schemas/SuiteJobInfo"
        hooks:
          type: array
          items:
            $ref: "#/components/schemas/HookTaskInfo"

    StopAgentJobResp:
      type: object
      required:
        - stopped
      properties:
        stopped:
          type: boolean
          description: >-
            False when there was no in-flight job to stop — an ordinary answer,
            not an error. The other fields are then absent.
        suite_uuid:
          type: string
          format: uuid
          description: The suite whose job was stopped
        job_id:
          type: integer
          format: int32
          description: The suite-scoped job number of the stopped job

    AgentState:
      type: string
      enum:
        - Idle
        - Provisioning
        - Executing
        - Cleaning
        - Offline

    AgentMetadata:
      type: object
      required:
        - version
        - long_version
      properties:
        version:
          type: string
        long_version:
          type: string

    RegisterAgentReq:
      type: object
      required:
        - machine_code
      properties:
        tags:
          type: array
          items:
            type: string
          description: >-
            Tags a suite is matched against. An agent is eligible for a suite
            when it carries every tag the suite asks for.
        labels:
          type: array
          items:
            type: string
          description: Free-form labels for querying; not used for matching
        admin_group:
          type: string
          description: >-
            The group granted Admin over the agent — the role that may shut it
            down. The caller must be an Admin of it. Defaults to the caller's
            personal group.
        groups:
          type: array
          items:
            type: string
          description: Groups that gain Write access to the agent
        lifetime:
          type: string
          description: >-
            Token lifetime as a human duration. When omitted the token never
            expires.
          example: 30d
        machine_code:
          type: string
          description: >-
            Stable identifier for the host. Registration is keyed on it, so a
            restarting agent must present the same value to re-adopt its record.
        metadata:
          $ref: "#/components/schemas/AgentMetadata"

    RegisterAgentResp:
      type: object
      required:
        - agent_uuid
        - token
        - notification_counter
        - reused
      properties:
        agent_uuid:
          type: string
          format: uuid
        token:
          type: string
          description: The agent's JWT, used for every agent-authenticated call
        notification_counter:
          type: integer
          format: uint64
          description: Start of the agent's notification sequence
        reused:
          type: boolean
          description: True if an existing agent record for this machine was re-adopted

    AgentInfo:
      type: object
      required:
        - uuid
        - creator_username
        - tags
        - labels
        - state
        - last_heartbeat
        - created_at
        - updated_at
      properties:
        uuid:
          type: string
          format: uuid
        creator_username:
          type: string
        tags:
          type: array
          items:
            type: string
        labels:
          type: array
          items:
            type: string
        state:
          $ref: "#/components/schemas/AgentState"
        last_heartbeat:
          type: string
          format: date-time
        assigned_suite_uuid:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        machine_code:
          type: string
        metadata:
          type: object

    AgentsQueryReq:
      type: object
      required:
        - count
      properties:
        group_name:
          type: string
          description: Defaults to the caller's personal group
        tags:
          type: array
          items:
            type: string
        labels:
          type: array
          items:
            type: string
        states:
          type: array
          items:
            $ref: "#/components/schemas/AgentState"
        creator_username:
          type: string
        limit:
          type: integer
          format: uint64
        offset:
          type: integer
          format: uint64
        count:
          type: boolean
          description: Return only the number of matching agents

    AgentsQueryResp:
      type: object
      required:
        - count
        - agents
        - group_name
      properties:
        count:
          type: integer
          format: uint64
        agents:
          type: array
          items:
            $ref: "#/components/schemas/AgentInfo"
        group_name:
          type: string

    AgentMetrics:
      type: object
      required:
        - active_workers
        - tasks_completed
        - tasks_failed
      properties:
        active_workers:
          type: integer
          format: uint32
        tasks_completed:
          type: integer
          format: uint64
        tasks_failed:
          type: integer
          format: uint64

    AgentHeartbeatReq:
      type: object
      required:
        - state
      properties:
        state:
          $ref: "#/components/schemas/AgentState"
        assigned_suite_uuid:
          type: string
          format: uuid
        last_notification_id:
          type: integer
          format: uint64
          description: >-
            The highest notification id the agent has processed. Acknowledges
            through this id; anything beyond it is returned again.
        metrics:
          $ref: "#/components/schemas/AgentMetrics"

    AgentHeartbeatResp:
      type: object
      required:
        - notifications
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/WsNotificationEvent"

    TaskSuiteSpec:
      type: object
      required:
        - uuid
        - group_name
        - tags
        - labels
        - priority
        - worker_schedule
        - state
        - total_tasks
        - incomplete_tasks
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        group_name:
          type: string
        tags:
          type: array
          items:
            type: string
        labels:
          type: array
          items:
            type: string
        priority:
          type: integer
          format: int32
        worker_schedule:
          $ref: "#/components/schemas/WorkerSchedulePlan"
        exec_hooks:
          $ref: "#/components/schemas/ExecHooks"
        state:
          $ref: "#/components/schemas/TaskSuiteState"
        total_tasks:
          type: integer
          format: int32
        incomplete_tasks:
          type: integer
          format: int32

    AcceptSuiteReq:
      type: object
      properties:
        suite_uuid:
          type: string
          format: uuid
          description: >-
            The suite the agent was notified about, if any. A preference, not a
            demand: one that is gone, drained, cancelled or no longer this
            agent's falls back to the best available suite.

    AcceptSuiteResp:
      type: object
      required:
        - accepted
      properties:
        accepted:
          type: boolean
        suite:
          allOf:
            - $ref: "#/components/schemas/TaskSuiteSpec"
          description: What to run. Present exactly when `accepted` is true.
        job:
          type: integer
          format: int64
          description: Opaque job handle, echoed on every later job-scoped call
        job_id:
          type: integer
          format: int32
          description: Suite-scoped job number, for display
        reason:
          type: string
          description: Why nothing was claimed, when `accepted` is false

    StartJobReq:
      type: object
      required:
        - job
      properties:
        job:
          type: integer
          format: int64

    EnterCleanupReq:
      type: object
      required:
        - job
      properties:
        job:
          type: integer
          format: int64

    JobFailureKind:
      type: string
      enum:
        - ProvisionFailed
        - BackgroundExited
        - ExecutionError
        - CleanupFailed

    JobFailureReason:
      type: object
      required:
        - kind
        - message
      properties:
        kind:
          $ref: "#/components/schemas/JobFailureKind"
        message:
          type: string

    SuiteJobOutcome:
      oneOf:
        - type: string
          enum:
            - Completed
        - type: object
          required:
            - Failed
          properties:
            Failed:
              type: object
              required:
                - reason
              properties:
                reason:
                  $ref: "#/components/schemas/JobFailureReason"
      description: >-
        What the agent did. Lost and Killed are coordinator decisions and are
        never agent outcomes.

    CompleteJobReq:
      type: object
      required:
        - job
        - outcome
      properties:
        job:
          type: integer
          format: int64
        outcome:
          $ref: "#/components/schemas/SuiteJobOutcome"

    CompleteJobResp:
      type: object
      required:
        - next_suite_available
      properties:
        next_suite_available:
          type: boolean

    HookReportOp:
      oneOf:
        - type: object
          required:
            - Result
          properties:
            Result:
              $ref: "#/components/schemas/TaskResultSpec"
        - type: object
          required:
            - Upload
          properties:
            Upload:
              type: object
              required:
                - content_type
                - content_length
              properties:
                content_type:
                  $ref: "#/components/schemas/ArtifactContentType"
                content_length:
                  type: integer
                  format: uint64

    HookReportReq:
      type: object
      required:
        - job
        - hook_type
        - op
      properties:
        job:
          type: integer
          format: int64
        hook_type:
          $ref: "#/components/schemas/HookType"
        op:
          $ref: "#/components/schemas/HookReportOp"

    HookReportResp:
      type: object
      required:
        - hook_uuid
      properties:
        hook_uuid:
          type: string
          format: uuid
          description: The key this hook's artifacts are stored under
        url:
          type: string
          description: Presigned upload URL, for the Upload operation

    FetchTasksReq:
      type: object
      required:
        - suite_uuid
      properties:
        suite_uuid:
          type: string
          format: uuid
        max_count:
          type: integer
          format: uint32
          default: 1

    FetchTasksResp:
      type: object
      required:
        - tasks
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/WorkerTaskResp"
        hold_job_open:
          type: boolean
          default: false
          description: >-
            Whether the agent should keep waiting on this job rather than wind it
            down — true while the suite is `Open`, which covers "drained, but not
            idle long enough to be sure". An empty `tasks` with this set means
            "come back and ask again", not "there is no more work", so a task
            submitted moments later runs in the same job against the environment
            its provision hook already built. It goes false once the
            coordinator's idle sweep has settled the suite.

    ReportAgentTaskReq:
      type: object
      required:
        - job
        - id
        - op
      properties:
        job:
          type: integer
          format: int64
          description: The job this task belongs to
        id:
          type: integer
          format: int64
          description: Internal task id, from the fetched task
        op:
          $ref: "#/components/schemas/ReportTaskOp"

    AgentNotification:
      type: object
      required:
        - type
      discriminator:
        propertyName: type
      properties:
        type:
          type: string
          enum:
            - suite_available
            - preempt_suite
            - suite_cancelled
            - tasks_cancelled
            - shutdown
            - ping
            - counter_sync
      description: |
        A coordinator → agent hint prompting an HTTP action:
        - suite_available: a suite is ready for this agent to claim
        - preempt_suite: stop the current suite for a higher-priority one.
          **Not emitted yet** — a running agent is never interrupted; the variant
          exists so preemption can be enabled without a protocol change
        - suite_cancelled: the suite being run was cancelled
        - tasks_cancelled: specific tasks were cancelled
        - shutdown: stop, gracefully or immediately
        - ping: keepalive
        - counter_sync: reset the notification sequence (coordinator restart)

    WsNotificationEvent:
      type: object
      required:
        - id
        - event
      properties:
        id:
          type: integer
          format: uint64
          description: Per-agent, monotonically increasing sequence id
        event:
          $ref: "#/components/schemas/AgentNotification"

    AgentWsMessage:
      type: object
      required:
        - type
      discriminator:
        propertyName: type
      properties:
        type:
          type: string
          enum:
            - ack
            - pong
      description: |
        An agent → coordinator frame:
        - ack: the agent processed a notification, identified by
          `notification_id`; it then leaves the replay buffer
        - pong: reply to a ping, carrying `client_time`

    RemoteResourceDownloadResp:
      type: object
      required:
        - url
        - size
      properties:
        url:
          type: string
          description: Presigned download URL
        size:
          type: integer
          format: int64

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: User authentication and session management
  - name: Users
    description: User account management
  - name: Groups
    description: Group management and file attachments
  - name: Workers
    description: Worker registration and management
  - name: Tasks
    description: Task submission and monitoring
  - name: Suites
    description: Task suite lifecycle, agent assignment, and job inspection
  - name: Agents
    description: Agent fleet management and the suite execution loop
  - name: Admin
    description: Administrative operations
  - name: Health
    description: Service health and status
  - name: Pubsub
    description: Publish or subscribe to task state transition
