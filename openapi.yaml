    TaskSuiteState:
      type: string
      enum:
        - Open
        - Closed
        - Complete
        - Cancelled
      description: |
        Task suite lifecycle state:
        - Open: accepting and running tasks
        - Closed: idle marker; still accepts/runs tasks, a new task reopens it
        - Complete: no incomplete tasks remain; a new task reopens it
        - Cancelled: terminal; cannot accept tasks

    CpuBindingStrategy:
      type: string
      enum:
        - RoundRobin
        - Exclusive
        - Shared
      description: How workers are bound to the specified CPU cores

