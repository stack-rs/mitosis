          nullable: true
          description: Optional human-readable name (non-unique; if present, must not be blank)
          example: nightly-eval
        description:
          type: string
          nullable: true
          description: Optional description
        group_name:
          type: string
          description: Group that owns the suite (caller needs Write/Admin in it)
          example: research-team
        tags:
          type: array
          items:
            type: string
          description: Tags for agent matching
          example:
