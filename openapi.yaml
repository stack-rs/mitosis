openapi: 3.0.0
info:
  title: Mitosis API
  description: |
    Mitosis is a unified distributed transport evaluation framework that provides REST API endpoints 
    for managing users, groups, workers, and tasks in a distributed computing environment.

    ## Authentication
    Most endpoints require JWT bearer token authentication. Get a token by calling `/login` with 
    valid credentials.

    ## API Structure
    - `/auth` - User authentication status
    - `/login` - User login
    - `/refresh` - Refresh current login token
    - `/revoke` - Revoke all login tokens for current user
    - `/users` - User management
    - `/groups` - Group management and file attachments
    - `/workers` - Worker registration and management
    - `/tasks` - Task submission and monitoring
    - `/admin` - Administrative operations (admin users only)
    - `/health` - Service health check
    - `/redis` - Redis connection information
  version: 0.6.0
  contact:
    name: Mitosis
    url: https://github.com/stack-rs/mitosis
  license:
    name: Apache 2.0
    url: https://github.com/stack-rs/mitosis/blob/main/LICENSE

servers:
  - url: http://localhost:5000
    description: Local development server
  - url: https://api.mitosis.example.com
    description: Production server

paths:
  /health:
    get:
      summary: Health check
      description: Check if the Mitosis coordinator is running and healthy
      operationId: healthCheck
      tags:
        - Health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /login:
    post:
      summary: User login
      description: Authenticate user and receive JWT token
      operationId: userLogin
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLoginReq"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserLoginResp"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"

  /refresh:
    post:
      summary: Refresh current login token
      description: Refresh the current user's login token using a valid bearer token. This invalidates previously issued tokens for the same user.
      operationId: refreshToken
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserLoginResp"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /revoke:
    post:
      summary: Revoke all login tokens
      description: Revoke all issued login tokens for the current authenticated user.
      operationId: revokeTokens
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successfully revoked all login tokens
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth:
    get:
      summary: Get current user
      description: Get the username of the currently authenticated user
      operationId: userAuth
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Username of authenticated user
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /redis:
    get:
      summary: Get Redis connection info
      description: Get Redis connection URL for real-time task monitoring
      operationId: getRedisConnectionInfo
      tags:
        - Pubsub
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Redis connection information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedisConnectionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{username}/password:
    post:
      summary: Change user password
      description: Change the password for a user (own account only unless admin)
      operationId: changePassword
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
          example: johndoe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserChangePasswordReq"
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserChangePasswordResp"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/groups:
    get:
      summary: Query user groups
      description: Get all groups the authenticated user has access to
      operationId: queryUserGroups
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User groups with roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupsQueryResp"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /groups:
    post:
      summary: Create group
      description: Create a new group (user becomes admin of the group)
      operationId: createGroup
      tags:
        - Groups
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupReq"
      responses:
        "200":
          description: Group created successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /groups/{group_name}:
    get:
      summary: Get group information
      description: Get detailed information about a specific group
      operationId: getGroup
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: group_name
          in: path
          required: true
          schema:
            type: string
          example: research-team
      responses:
        "200":
          description: Group information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupQueryInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /groups/{group_name}/users:
    put:
      summary: Update user group roles
      description: Add users to group or update their roles
      operationId: updateUserGroup
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: group_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserGroupRoleReq"
      responses:
        "200":
          description: User roles updated successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Remove users from group (query params)
      description: Remove users from the group using query parameters
      operationId: removeUserGroupParams
      tags:
        - Groups
      security:
        - bearerAuth: []
      parameters:
        - name: group_name
          in: path
          required: true
          schema:
            type: string
        - name: users
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Comma-separated list of usernames to remove
      responses:
        "200":
          description: Users removed successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # /groups/{group_name}/users/remove:
  #   post:
  #     summary: Remove users from group (JSON body)
  #     description: Remove users from the group using JSON request body
  #     operationId: removeUserGroup
  #     tags:
  #       - Groups
  #     security:
  #       - bearerAuth: []
  #     parameters:
  #       - name: group_name
  #         in: path
  #         required: true
  #         schema:
  #           type: string
  #     requestBody:
  #       required: true
  #       content:
  #         application/json:
  #           schema:
  #             $ref: "#/components/schemas/RemoveUserGroupRoleReq"
  #     responses:
  #       "200":
  #         description: Users removed successfully
  #       "401":
  #         $ref: "#/components/responses/Unauthorized"
